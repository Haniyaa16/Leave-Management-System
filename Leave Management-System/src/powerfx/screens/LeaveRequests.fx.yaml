LeaveRequests As screen:
    Fill: =RGBA(244, 246, 250, 1)
    OnVisible: |-
        =Set(varBalance, LookUp('Leave Balances', Employee.'Primary Email' = User().Email && 'Balance Year' = Year(Today())));
        UpdateContext({locBusy: false})

    lblTitle As label:
        Text: ="Leave Requests"
        FontSize: =22
        FontWeight: =FontWeight.Bold
        X: =24
        Y: =16
        Width: =400
        Height: =44

    btnManager As button:
        Text: ="Manager approval"
        Visible: =varIsManager
        OnSelect: =Navigate(ManagerApproval, ScreenTransition.Fade)
        X: =Parent.Width - 224
        Y: =20
        Width: =200
        Height: =40

    lblBalAnnual As label:
        Text: |-
            ="Annual leave left: " & Coalesce(varBalance.'Annual Leave Balance', 0)
        X: =24
        Y: =76
        Width: =(Parent.Width - 48) / 4 - 12
        Height: =60
        Fill: =RGBA(221, 235, 247, 1)
        Align: =Align.Center

    lblBalSick As label:
        Text: |-
            ="Sick leave: " & Coalesce(varBalance.'Sick Leave Balance', 0)
        X: =24 + 1 * ((Parent.Width - 48) / 4)
        Y: =76
        Width: =lblBalAnnual.Width
        Height: =60
        Fill: =RGBA(252, 228, 236, 1)
        Align: =Align.Center

    lblBalOther As label:
        Text: |-
            ="Other leave: " & Coalesce(varBalance.'Other Leave Balance', 0)
        X: =24 + 2 * ((Parent.Width - 48) / 4)
        Y: =76
        Width: =lblBalAnnual.Width
        Height: =60
        Fill: =RGBA(237, 235, 233, 1)
        Align: =Align.Center

    lblUsed As label:
        Text: |-
            ="Annual days used: " & Coalesce(varBalance.'Total Used', 0)
        X: =24 + 3 * ((Parent.Width - 48) / 4)
        Y: =76
        Width: =lblBalAnnual.Width
        Height: =60
        Fill: =RGBA(223, 246, 221, 1)
        Align: =Align.Center

    ddType As dropdown:
        Items: =Choices('Leave Requests'.'Leave Type')
        X: =24
        Y: =156
        Width: =500

    dpStart As datepicker:
        DefaultDate: =Today()
        X: =24
        Y: =212
        Width: =244

    dpEnd As datepicker:
        DefaultDate: =dpStart.SelectedDate
        X: =280
        Y: =212
        Width: =244

    txtReason As text:
        Mode: =TextMode.MultiLine
        HintText: ="Reason for leave (required)"
        X: =24
        Y: =268
        Width: =500
        Height: =100

    lblDays As label:
        Text: =CountRows(Filter(ForAll(Sequence(Max(0, DateDiff(dpStart.SelectedDate, dpEnd.SelectedDate, TimeUnit.Days) + 1), 0), DateAdd(dpStart.SelectedDate, Value, TimeUnit.Days)), Weekday(Value, StartOfWeek.Monday) < 6))
        X: =24
        Y: =376
        Width: =80
        Height: =32

    lblDaysCaption As label:
        Text: ="working days requested (Mon-Fri)"
        X: =108
        Y: =376
        Width: =416
        Height: =32

    lblErr As label:
        Text: |-
            =If(IsBlank(varMe.Manager), "No manager is assigned to your user account. Contact the administrator.", If(dpEnd.SelectedDate < dpStart.SelectedDate, "End date cannot be before the start date.", If(And(ddType.Selected.Value <> "Sick", dpStart.SelectedDate < Today()), "Start date cannot be in the past (only Sick leave may be back-dated).", If(Value(lblDays.Text) = 0, "The selected range contains no working days.", If(IsBlank(Trim(txtReason.Text)), "Reason is required.", If(IsBlank(varBalance), "No leave balance record exists for this year.", If(And(ddType.Selected.Value = "Annual", Value(lblDays.Text) > varBalance.'Annual Leave Balance'), "Insufficient annual leave balance: " & varBalance.'Annual Leave Balance' & " day(s) available.", "")))))))
        Color: =RGBA(168, 0, 0, 1)
        X: =24
        Y: =412
        Width: =500
        Height: =44

    lblOverlapCount As label:
        Text: =CountRows(Filter('Leave Requests', Employee.'Primary Email' = User().Email, 'Leave Status' = 'LMS Leave Status'.Pending || 'Leave Status' = 'LMS Leave Status'.Approved, 'Start Date' <= dpEnd.SelectedDate, 'End Date' >= dpStart.SelectedDate))
        Visible: =false
        X: =24
        Y: =460

    lblOverlap As label:
        Text: |-
            ="Warning: these dates overlap " & lblOverlapCount.Text & " of your existing request(s)."
        Visible: =Value(lblOverlapCount.Text) > 0
        Color: =RGBA(138, 90, 0, 1)
        Fill: =RGBA(255, 244, 206, 1)
        X: =24
        Y: =460
        Width: =500
        Height: =40

    chkConfirm As checkbox:
        Text: ="I understand and still want to submit"
        Visible: =lblOverlap.Visible
        X: =24
        Y: =504
        Width: =500

    btnSubmit As button:
        Text: ="Submit request"
        DisplayMode: =If(lblErr.Text <> "" || locBusy || (lblOverlap.Visible && !chkConfirm.Value), DisplayMode.Disabled, DisplayMode.Edit)
        X: =24
        Y: =544
        Width: =500
        OnSelect: |-
            =UpdateContext({locBusy: true});
            Patch('Leave Requests', Defaults('Leave Requests'), {
                'Request Title': ddType.Selected.Value & " leave - " & Text(dpStart.SelectedDate, "dd mmm yyyy"),
                Employee: varMe,
                Manager: varMe.Manager,
                'Leave Type': ddType.Selected,
                'Start Date': dpStart.SelectedDate,
                'End Date': dpEnd.SelectedDate,
                'Days Requested': Value(lblDays.Text),
                Reason: txtReason.Text,
                'Leave Status': 'LMS Leave Status'.Pending,
                'Balance Deducted': false
            });
            If(IsEmpty(Errors('Leave Requests')),
                Notify("Leave request submitted and sent to your manager.", NotificationType.Success);
                Reset(txtReason); Reset(chkConfirm),
                Notify(First(Errors('Leave Requests')).Message, NotificationType.Error));
            UpdateContext({locBusy: false})

    lblMine As label:
        Text: ="My leave requests"
        FontWeight: =FontWeight.Semibold
        X: =556
        Y: =156
        Width: =200
        Height: =32

    ddFilter As dropdown:
        Items: =["All", "Pending", "Approved", "Rejected"]
        X: =Parent.Width - 224
        Y: =156
        Width: =200

    galMine As gallery.galleryVertical:
        Items: =Sort(Filter('Leave Requests', Employee.'Primary Email' = User().Email, ddFilter.Selected.Value = "All" || 'Leave Status'.Value = ddFilter.Selected.Value), 'Start Date', SortOrder.Descending)
        TemplateSize: =92
        X: =556
        Y: =196
        Width: =Parent.Width - 580
        Height: =Parent.Height - 220

        lblItemTitle As label:
            Text: |-
                =ThisItem.'Leave Type'.Value & ": " & Text(ThisItem.'Start Date', "dd mmm") & " to " & Text(ThisItem.'End Date', "dd mmm yyyy") & " (" & ThisItem.'Days Requested' & " days)"
            FontWeight: =FontWeight.Semibold
            X: =8
            Y: =6
            Width: =Parent.TemplateWidth - 16
            Height: =30

        lblItemStatus As label:
            Text: =ThisItem.'Leave Status'.Value
            Color: =Switch(ThisItem.'Leave Status'.Value, "Approved", RGBA(16, 124, 16, 1), "Rejected", RGBA(168, 0, 0, 1), RGBA(138, 90, 0, 1))
            FontWeight: =FontWeight.Bold
            X: =8
            Y: =36
            Width: =Parent.TemplateWidth - 16
            Height: =26

        lblItemComment As label:
            Text: |-
                =If(IsBlank(ThisItem.'Manager Comments'), "", "Manager: " & ThisItem.'Manager Comments')
            X: =8
            Y: =62
            Width: =Parent.TemplateWidth - 16
            Height: =26
